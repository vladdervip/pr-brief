<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Brief</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>PR Brief</h1>
      <p class="sub">Ссылка на PR → короткий бриф для продакта</p>
    </header>

    <form id="form">
      <label for="pr">GitHub PR</label>
      <input
        id="pr"
        name="pr"
        type="text"
        placeholder="https://github.com/owner/repo/pull/123"
        autocomplete="off"
        required
      />
      <button type="submit" id="go">Сделать бриф</button>
    </form>

    <p id="status" class="status" hidden></p>
    <article id="out" class="card" hidden></article>
  </main>
  <script src="/app.js"></script>
</body>
</html>
